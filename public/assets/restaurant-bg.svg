<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="restaurant-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Chef hat pattern -->
      <g opacity="0.1">
        <path d="M100 50 C120 30 140 30 160 50 L160 80 C160 90 150 100 140 100 L60 100 C50 100 40 90 40 80 L40 50 C60 30 80 30 100 50 Z" fill="#FF6B35"/>
        <circle cx="100" cy="40" r="8" fill="#FF6B35"/>
      </g>
      
      <!-- Utensils pattern -->
      <g opacity="0.08" transform="translate(150, 150)">
        <rect x="0" y="0" width="4" height="30" fill="#FF6B35"/>
        <rect x="8" y="0" width="4" height="30" fill="#FF6B35"/>
        <rect x="16" y="0" width="4" height="30" fill="#FF6B35"/>
        <rect x="0" y="25" width="20" height="2" fill="#FF6B35"/>
      </g>
      
      <!-- Plate pattern -->
      <g opacity="0.06" transform="translate(50, 150)">
        <circle cx="15" cy="15" r="12" fill="#FF6B35"/>
        <circle cx="15" cy="15" r="8" fill="none" stroke="#FF6B35" stroke-width="1"/>
      </g>
    </pattern>
    
    <!-- Gradient definitions -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#2d1b1b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d1f1f;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#2d1b1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="overlay-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#FF6B35;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)"/>
  
  <!-- Pattern overlay -->
  <rect width="1920" height="1080" fill="url(#restaurant-pattern)"/>
  
  <!-- Radial overlay -->
  <rect width="1920" height="1080" fill="url(#overlay-gradient)"/>
  
  <!-- Decorative elements -->
  <g opacity="0.15">
    <!-- Large chef hat -->
    <path d="M1600 200 C1700 100 1800 100 1900 200 L1900 400 C1900 450 1850 500 1800 500 L1700 500 C1650 500 1600 450 1600 400 L1600 200 Z" fill="#FF6B35"/>
    <circle cx="1750" cy="150" r="40" fill="#FF6B35"/>
    
    <!-- Large utensils -->
    <g transform="translate(200, 800)">
      <rect x="0" y="0" width="20" height="150" fill="#FF6B35"/>
      <rect x="40" y="0" width="20" height="150" fill="#FF6B35"/>
      <rect x="80" y="0" width="20" height="150" fill="#FF6B35"/>
      <rect x="0" y="125" width="100" height="10" fill="#FF6B35"/>
    </g>
    
    <!-- Large plate -->
    <g transform="translate(1600, 800)">
      <circle cx="80" cy="80" r="60" fill="#FF6B35"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#FF6B35" stroke-width="3"/>
    </g>
  </g>
</svg>
